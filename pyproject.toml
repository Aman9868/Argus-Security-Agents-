[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Cybersecurity Platform with LangGraph, Tool Gateway, and Security Guardrails"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.2.20",
    "langchain-groq>=0.1.6",
    "groq>=0.9.0",
    "redis>=5.0.4",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "guardrails-ai>=0.11.0",
    "langsmith>=0.1.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "apps*", "gateway*", "policies*", "security*", "storage*", "tools*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*"]

[tool.vercel]
entrypoint = "apps.api.main:app"


